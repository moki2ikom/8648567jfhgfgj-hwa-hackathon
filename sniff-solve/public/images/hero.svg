<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FED7AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDBA74;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF08A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE047;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BFDBFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E9D5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8B4FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BBF7D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#86EFAC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FECACA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCA5A5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="480" width="600" height="60" rx="15" fill="url(#baseGrad)"/>
    <rect x="100" y="460" width="600" height="20" rx="5" fill="#111827"/>

    <g>
      <rect x="140" y="360" width="85" height="85" rx="12" fill="url(#moduleGrad1)"/>
      <text x="182.5" y="415" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#78350F">SCENT MAZE</text>

      <rect x="255" y="360" width="85" height="85" rx="12" fill="url(#moduleGrad2)"/>
      <text x="297.5" y="415" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#713F12">TREAT TUMBLE</text>

      <rect x="370" y="360" width="85" height="85" rx="12" fill="url(#moduleGrad3)"/>
      <text x="412.5" y="415" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#1E3A5F">FLIP & FIND</text>

      <rect x="485" y="360" width="85" height="85" rx="12" fill="url(#moduleGrad4)"/>
      <text x="527.5" y="415" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#4C1D95">SNIFFLE SPIRAL</text>

      <rect x="600" y="360" width="85" height="85" rx="12" fill="url(#moduleGrad5)"/>
      <text x="642.5" y="415" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#14532D">SCENT TUBES</text>

      <rect x="715" y="360" width="85" height="85" rx="12" fill="url(#moduleGrad6)"/>
      <text x="757.5" y="415" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#7F1D1D">PAW PRESS</text>
    </g>
  </g>

  <text x="400" y="120" text-anchor="middle" font-family="system-ui" font-size="32" font-weight="800" fill="#1F2937" letter-spacing="-0.5px">SNIFF & SOLVE</text>
  <text x="400" y="160" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="500" fill="#B45309">MODULAR SCENT PUZZLE SYSTEM</text>

  <circle cx="400" cy="410" r="200" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="10,10" opacity="0.3"/>
  <circle cx="400" cy="410" r="160" fill="none" stroke="#FDBA74" stroke-width="1" stroke-dasharray="8,8" opacity="0.2"/>
</svg>